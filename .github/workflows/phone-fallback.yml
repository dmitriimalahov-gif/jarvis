name: Publish prepared JARVIS phone release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jarvis-phone-fallback
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage only verified phone shell files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const commit = '251c23c7714716f55d404722b0e8a8335b1ce88a';
          const version = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          if (version.commit !== commit) throw new Error('Unexpected release');
          const files = JSON.parse(Buffer.from('', 'base64').toString());
          const root = fs.realpathSync('.');
          fs.mkdirSync('_site');
          for (const [name, expected] of Object.entries(files)) {
            if (!fs.lstatSync(name).isFile() || !fs.realpathSync(name).startsWith(root + path.sep))
              throw new Error('Unexpected file: ' + name);
            const bytes = fs.readFileSync(name);
            if (crypto.createHash('sha256').update(bytes).digest('hex') !== expected)
              throw new Error('Different release file: ' + name);
            fs.mkdirSync(path.dirname(path.join('_site', name)), {recursive: true});
            fs.writeFileSync(path.join('_site', name), bytes);
          }
          fs.writeFileSync('_site/version.json', JSON.stringify({commit, built: new Date().toISOString()}) + '\n');
          console.log('Verified and staged ' + Object.keys(files).length + ' public shell files.');
          NODE
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish existing phone shell
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
